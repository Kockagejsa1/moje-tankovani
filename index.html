<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1565c0">

<title>MOJE TANKOVÁNÍ</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f5f9;
    color: #17202a;
}

.header {
    background: #1565c0;
    color: white;
    padding: 22px 24px;
    font-size: 26px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header span {
    font-size: 30px;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.vehicle {
    background: white;
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
    margin-bottom: 20px;
}

.vehicle h2 {
    margin: 0 0 8px;
}

.vehicle-info {
    color: #68737d;
    font-size: 16px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 20px;
}

.stat {
    background: white;
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 3px 10px rgba(0,0,0,.07);
}

.stat-title {
    color: #6b747c;
    font-size: 14px;
    margin-bottom: 8px;
}

.stat-value {
    font-size: 25px;
    font-weight: bold;
    color: #1565c0;
}

.buttons {
    display: flex;
    gap: 12px;
    margin-bottom: 22px;
    flex-wrap: wrap;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 14px 20px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.primary {
    background: #1565c0;
    color: white;
}

.secondary {
    background: white;
    color: #1565c0;
    border: 1px solid #1565c0;
}

.section {
    background: white;
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 3px 12px rgba(0,0,0,.07);
}

.section h2 {
    margin-top: 0;
}

.refuel {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 10px;
    padding: 14px 0;
    border-bottom: 1px solid #e4e8ec;
}

.refuel:last-child {
    border-bottom: none;
}

.refuel strong {
    color: #1565c0;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 10;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-content {
    background: white;
    width: 100%;
    max-width: 500px;
    border-radius: 20px;
    padding: 24px;
}

.modal-content h2 {
    margin-top: 0;
}

label {
    display: block;
    margin-top: 12px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    border: 1px solid #cbd3da;
    border-radius: 10px;
    font-size: 16px;
}

.modal-buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

@media (max-width: 700px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .refuel {
        grid-template-columns: 1fr 1fr;
    }
}

@media (max-width: 450px) {
    .header {
        font-size: 21px;
    }

    .container {
        padding: 12px;
    }

    .stats {
        grid-template-columns: 1fr 1fr;
    }
}
</style>
</head>

<body>

<div class="header">
    <div>🚗 MOJE TANKOVÁNÍ</div>
    <span>⛽</span>
</div>

<div class="container">

    <div class="vehicle">
        <h2>Hyundai i30</h2>
        <div class="vehicle-info">
            Benzín • Nádrž 50 l • Aktuálně 40 372 km
        </div>
    </div>

    <div class="stats">

        <div class="stat">
            <div class="stat-title">Poslední spotřeba</div>
            <div class="stat-value" id="lastConsumption">—</div>
        </div>

        <div class="stat">
            <div class="stat-title">Dlouhodobá spotřeba</div>
            <div class="stat-value" id="averageConsumption">—</div>
        </div>

        <div class="stat">
            <div class="stat-title">Celkem litrů</div>
            <div class="stat-value" id="totalLiters">0 l</div>
        </div>

        <div class="stat">
            <div class="stat-title">Celkem Kč</div>
            <div class="stat-value" id="totalCost">0 Kč</div>
        </div>

    </div>

    <div class="buttons">
        <button class="primary" onclick="openModal()">
            ＋ Tankování
        </button>

        <button class="secondary" onclick="alert('Statistiky budou rozšířeny v další verzi.')">
            📊 Statistiky
        </button>
    </div>

    <div class="section">

        <h2>Poslední tankování</h2>

        <div id="history">
            <p>Zatím není zaznamenáno žádné tankování.</p>
        </div>

    </div>

</div>


<!-- MODAL NOVÉ TANKOVÁNÍ -->

<div class="modal" id="modal">

    <div class="modal-content">

        <h2>Nové tankování</h2>

        <label>Datum</label>
        <input type="date" id="date">

        <label>Stav tachometru (km)</label>
        <input type="number" id="odometer">

        <label>Litry</label>
        <input type="number" step="0.01" id="liters">

        <label>Cena za litr (Kč)</label>
        <input type="number" step="0.01" id="price">

        <label>Čerpací stanice</label>
        <input type="text" id="station" placeholder="Např. MOL">

        <label>
            <input type="checkbox" id="fullTank" style="width:auto">
            Plná nádrž
        </label>

        <div class="modal-buttons">

            <button class="primary" onclick="saveRefuel()">
                Uložit
            </button>

            <button class="secondary" onclick="closeModal()">
                Zrušit
            </button>

        </div>

    </div>

</div>


<script>

let refuels = JSON.parse(
    localStorage.getItem("mojeTankovani") || "[]"
);


function openModal() {

    document.getElementById("modal").style.display = "flex";

    document.getElementById("date").value =
        new Date().toISOString().substring(0,10);
}


function closeModal() {

    document.getElementById("modal").style.display = "none";
}


function saveRefuel() {

    const date =
        document.getElementById("date").value;

    const odometer =
        Number(document.getElementById("odometer").value);

    const liters =
        Number(document.getElementById("liters").value);

    const price =
        Number(document.getElementById("price").value);

    const station =
        document.getElementById("station").value;

    const fullTank =
        document.getElementById("fullTank").checked;


    if (!date || !odometer || !liters || !price) {

        alert("Vyplň prosím datum, tachometr, litry a cenu.");
        return;
    }


    const totalPrice = liters * price;


    refuels.push({

        date,
        odometer,
        liters,
        price,
        totalPrice,
        station,
        fullTank

    });


    refuels.sort(
        (a,b) => a.odometer - b.odometer
    );


    localStorage.setItem(
        "mojeTankovani",
        JSON.stringify(refuels)
    );


    closeModal();

    document.getElementById("odometer").value = "";
    document.getElementById("liters").value = "";
    document.getElementById("price").value = "";
    document.getElementById("station").value = "";
    document.getElementById("fullTank").checked = false;


    render();

}


function calculateConsumption() {

    const full = refuels.filter(
        x => x.fullTank
    );


    if (full.length < 2) {

        return {
            last: null,
            average: null
        };

    }


    let intervals = [];


    for (let i = 1; i < full.length; i++) {

        const previous = full[i-1];
        const current = full[i];

        const distance =
            current.odometer - previous.odometer;


        if (distance <= 0) continue;


        const liters = refuels
            .filter(x =>
                x.odometer > previous.odometer &&
                x.odometer <= current.odometer
            )
            .reduce(
                (sum,x) => sum + x.liters,
                0
            );


        intervals.push({

            distance,
            liters,

            consumption:
                liters / distance * 100

        });

    }


    if (!intervals.length) {

        return {
            last: null,
            average: null
        };

    }


    const totalDistance =
        intervals.reduce(
            (sum,x) => sum + x.distance,
            0
        );


    const totalLiters =
        intervals.reduce(
            (sum,x) => sum + x.liters,
            0
        );


    return {

        last:
            intervals[intervals.length - 1]
                .consumption,

        average:
            totalLiters /
            totalDistance *
            100

    };

}


function render() {

    const history =
        document.getElementById("history");


    if (!refuels.length) {

        history.innerHTML =
            "<p>Zatím není zaznamenáno žádné tankování.</p>";

    } else {

        const last =
            [...refuels]
                .reverse()
                .slice(0,10);


        history.innerHTML =
            last.map(x => `

                <div class="refuel">

                    <div>
                        <strong>${formatDate(x.date)}</strong>
                    </div>

                    <div>
                        ${x.odometer.toLocaleString("cs-CZ")} km
                    </div>

                    <div>
                        ${x.liters.toFixed(2)} l
                    </div>

                    <div>
                        ${x.totalPrice.toFixed(0)} Kč
                    </div>

                </div>

            `).join("");

    }


    const totalLiters =
        refuels.reduce(
            (sum,x) => sum + x.liters,
            0
        );


    const totalCost =
        refuels.reduce(
            (sum,x) => sum + x.totalPrice,
            0
        );


    document.getElementById("totalLiters")
        .textContent =
        totalLiters.toFixed(1) + " l";


    document.getElementById("totalCost")
        .textContent =
        totalCost.toFixed(0) + " Kč";


    const consumption =
        calculateConsumption();


    document.getElementById("lastConsumption")
        .textContent =
        consumption.last
            ? consumption.last.toFixed(2) + " l/100 km"
            : "—";


    document.getElementById("averageConsumption")
        .textContent =
        consumption.average
            ? consumption.average.toFixed(2) + " l/100 km"
            : "—";

}


function formatDate(date) {

    if (!date) return "";

    const parts =
        date.split("-");

    return parts[2] + "." +
           parts[1] + "." +
           parts[0];

}


render();

</script>

</body>
</html>
